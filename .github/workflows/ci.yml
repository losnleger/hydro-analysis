name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile scripts/scs_unit_hydrograph.py scripts/generate_chart.py
      - run: python -m pytest -q

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile scripts/scs_unit_hydrograph.py scripts/generate_chart.py
      - run: python -m pytest -q
      - run: python scripts/scs_unit_hydrograph.py
      - run: python scripts/generate_chart.py --output outputs/ci_hydrograph.png --dpi 96
